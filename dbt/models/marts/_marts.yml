version: 2

models:
  - name: fact_orders
    description: >
      Order fact, one row per order. Incremental (delete+insert on order_id) with a
      lookback window so late refunds update their original order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_key}
      - name: merchant_key
        description: Version of the merchant valid at order time.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_merchant'), field: merchant_key}
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: {values: [delivered, cancelled, refunded]}
      - name: gross_amount
        data_tests: [not_null, non_negative]
      - name: captured_amount
        data_tests: [non_negative]
      - name: refunded_amount
        data_tests: [non_negative]
      - name: commission_amount
        data_tests: [non_negative]
      - name: delivery_minutes
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 180}
      - name: items_count
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 50}

  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null, is_clean_email]

  - name: dim_merchant
    description: SCD type 2 merchant dimension; is_current marks the latest version.
    data_tests:
      - unique_combination:
          arguments: {columns: [merchant_id, valid_from]}
    columns:
      - name: merchant_key
        data_tests: [unique, not_null]
      - name: merchant_id
        data_tests: [not_null]
      - name: commission_rate
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 0.5}

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]
