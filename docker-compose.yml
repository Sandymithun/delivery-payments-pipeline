# Local stack:  docker compose up -d --build            -> Airflow UI on http://localhost:8080
#   + Kafka:    docker compose --profile streaming up -d  -> producer/consumer on topic order-events
#
# MinIO plays the part of S3 (same API, so the code is identical for AWS).
# DuckDB plays the part of Snowflake unless WAREHOUSE=snowflake in .env.

x-pipeline-env: &pipeline-env
  PIPELINE_HOME: /opt/pipeline
  PYTHONPATH: /opt/pipeline
  LOCAL_RAW_DIR: /opt/pipeline/data/raw
  DUCKDB_PATH: /opt/pipeline/warehouse/delivery.duckdb
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_BUCKET: ${S3_BUCKET:-delivery-lake}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
  WAREHOUSE: ${WAREHOUSE:-duckdb}
  DBT_TARGET: ${DBT_TARGET:-duckdb}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [postgres-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # pinned: MinIO stopped publishing new community images in late 2025; older tags remain
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9001 = web console
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
    image: delivery-pipeline-airflow:latest
    command: standalone   # api-server + scheduler + dag-processor + triggerer in one container
    user: "${AIRFLOW_UID:-50000}:0"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *pipeline-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/pipeline/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # local dev only: no login
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Dublin
    volumes:
      - .:/opt/pipeline
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped

  # ------------------------------------------------------------- streaming (optional)
  kafka:
    profiles: [streaming]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  event-producer:
    profiles: [streaming]
    image: delivery-pipeline-airflow:latest   # reuse the image: same libs, same code
    entrypoint: ["python", "-m", "streaming.producer"]
    command: ["--rate", "20"]
    environment:
      <<: *pipeline-env
      KAFKA_BOOTSTRAP: kafka:9092
    volumes: [".:/opt/pipeline"]
    working_dir: /opt/pipeline
    depends_on:
      kafka: {condition: service_healthy}

  event-consumer:
    profiles: [streaming]
    image: delivery-pipeline-airflow:latest
    entrypoint: ["python", "-m", "streaming.consumer"]
    environment:
      <<: *pipeline-env
      KAFKA_BOOTSTRAP: kafka:9092
    volumes: [".:/opt/pipeline"]
    working_dir: /opt/pipeline
    depends_on:
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}

volumes:
  postgres-db:
  minio-data:
